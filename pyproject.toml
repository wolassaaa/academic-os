[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-os-v2"
version = "2.0.0"
description = "A portable academic operations hub with durable scheduling and notifications"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.129", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "keyring>=25,<26", "tzdata>=2025", "mcp>=1.28,<2", "python-dateutil>=2.9,<3", "pywin32>=308; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "playwright>=1.51"]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8"]

[project.scripts]
academic-os = "academic_os.cli:main"
academic-os-mcp = "academic_os.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
academic_os = ["web/*", "vendor/*.json"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
